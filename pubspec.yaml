name: reaper_engine_loader
description: ReaperEngine Loader for Roblox

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  device_apps: ^2.2.0
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/reaper_script.lua
